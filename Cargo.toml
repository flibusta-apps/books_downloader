[package]
name = "books_downloader"
version = "0.1.0"
edition = "2021"


[profile.release]
opt-level = 3
debug = false
strip = true
lto = true
codegen-units = 1

[profile.profiling]
inherits = "release"
debug = true
strip = false


[dependencies]
tokio = { version = "1.44.2", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "signal", "sync"] }
tokio-util = { version = "0.7.14", features = ["io-util"] }
futures = "0.3.31"
reqwest = { version = "0.13.5", features = ["json", "stream", "multipart", "query"] }

tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"]}
sentry-tracing = "0.49.5"
tower-http = { version = "0.7.1", features = ["trace"] }

once_cell = "1.21.1"

serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
axum = "0.8.1"
translit = "0.8.0"
zip = { version = "9", default-features = false, features = ["deflate"] }
tempfile = "3.19.1"
bytes = "1.11.1"
axum-prometheus = "0.10.1"
metrics = "0.24"
base64 = "0.23.1"
thiserror = "2"

sentry = { version = "0.49.5", features = ["debug-images"] }
subtle = "2.6"

[dev-dependencies]
sentry = { version = "0.49.5", features = ["test"] }
metrics-util = "0.20"
